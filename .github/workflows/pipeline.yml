name: autotests

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  autotests:
    runs-on: ubuntu-latest
    container: golang:1.26.1

    steps:

      - name: Install dependencies
        run: |
          apt-get update && \
          DEBIAN_FRONTEND=noninteractive apt-get install -yq --no-install-recommends --no-install-suggests \
          gcc pkg-config libgl1-mesa-dev xorg-dev libasound2-dev libfreetype6-dev libfontconfig1-dev \
          xvfb xauth

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: |
            go.sum
            Makefile

      - name: Installing Golang tools
        run: |
          # go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8
          apt-get update && \
          DEBIAN_FRONTEND=noninteractive apt-get install -yq --no-install-recommends --no-install-suggests ca-certificates curl gcc g++ make
          curl -sSfL https://golangci-lint.run/install.sh | sh -s v2.11.4
          mkdir -p $(go env GOPATH)/bin
          mv bin/* $(go env GOPATH)/bin
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure Git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Run Lint
        run: |
          make lint

      - name: Run Tests
        # Runs tests via xvfb-run to exclude Fyne crashes with errors about unknown Display
        run: |
          xvfb-run --auto-servernum make test

      - name: Generate Coverage Report for GitHub
        if: always()
        run: |
          echo "## 📊 Test Coverage" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          make coverage >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: /tmp/proxy-checker-coverage.out
          fail_ci_if_error: false
          flags: unittests
          verbose: true
          # report_type: test_results # to upload junit.xml
        continue-on-error: true

  autotests-macos:
    runs-on: macos-latest

    steps:
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: |
            go.sum
            Makefile

      - name: Installing Golang tools
        run: |
          mkdir -p $(go env GOPATH)/bin
          curl -sSfL https://golangci-lint.run/install.sh | sh -s v2.11.4
          mv bin/* $(go env GOPATH)/bin

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Lint
        run: |
          make lint

      # Native darwin run executes the macos-tagged sysproxy tests
      # (pure-Go packages and GUI; cgo is provided by Xcode on the runner)
      - name: Run Tests
        run: |
          make test

  release:
    needs: autotests
    if: startsWith(github.ref, 'refs/tags/v') # starts only on tags with leading "v"

    runs-on: ubuntu-latest
    container: golang:1.26.1
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            artifact_name: proxy-checker-linux-amd64
#          - goos: windows
#            goarch: amd64
#            artifact_name: proxy-checker-windows-amd64.exe

    steps:

      - name: Install dependencies
        run: |
          apt-get update && \
          DEBIAN_FRONTEND=noninteractive apt-get install -yq --no-install-recommends --no-install-suggests \
          gcc pkg-config libgl1-mesa-dev xorg-dev libasound2-dev libfreetype6-dev libfontconfig1-dev

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure Git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build binary
        run: |
          APP_VERSION=${{ github.ref_name }} APP_NAME=${{ matrix.artifact_name }} make build

      - name: Create Release and Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          fetch-depth: 0
          name: Release ${{ github.ref_name }}
          files: ./bin/${{ matrix.artifact_name }}

  # darwin artifacts are built on a native macOS runner:
  # the GUI requires cgo (Xcode toolchain), which is unavailable in the Linux container.
  release-macos:
    needs: [autotests, autotests-macos, release] # serializes release upload to avoid races
    if: startsWith(github.ref, 'refs/tags/v')

    runs-on: macos-latest

    steps:
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: |
            go.sum
            Makefile

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build arm64 and amd64 binaries
        run: |
          APP_VERSION=${{ github.ref_name }} APP_NAME=proxy-checker-macos-arm64 GOARCH=arm64 make build
          APP_VERSION=${{ github.ref_name }} APP_NAME=proxy-checker-macos-amd64 GOARCH=amd64 make build

      - name: Create universal binary
        run: |
          lipo -create -output ./bin/proxy-checker-macos ./bin/proxy-checker-macos-arm64 ./bin/proxy-checker-macos-amd64
          lipo -info ./bin/proxy-checker-macos

      - name: Create Release and Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          fetch-depth: 0
          name: Release ${{ github.ref_name }}
          files: ./bin/proxy-checker-macos
